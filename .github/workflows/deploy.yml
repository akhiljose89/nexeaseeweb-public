# Builds the site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at nexeasee.com. Same result as 'npm run deploy', without
# the manual steps.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job pushes to gh-pages, so the token needs write access to repository contents.
permissions:
  contents: write

# Publish one build at a time. A newer push replaces a build that is still running, so
# the live site always ends up matching the latest commit on main.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      # Mirror dist/ into the branch. --delete drops files that no longer exist in the
      # build (old hashed bundles); the .git exclude protects the checkout's own git data.
      - name: Publish build to gh-pages
        run: |
          rsync -a --delete --exclude='.git' dist/ .gh-pages/
          cd .gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy: gh-pages already matches this build."
            exit 0
          fi
          git commit -m "Deploy from main@${GITHUB_SHA::7}"
          git push origin gh-pages
